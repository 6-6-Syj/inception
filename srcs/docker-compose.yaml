services:
  mariadb:
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    secrets:
      - mysql_user
      - db_password
      - db_root_password
    container_name: mariadb
    build: ./requirements/mariadb
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 1s
      timeout: 15s
      retries: 15
      start_period: 10s
    restart: on-failure
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception

  nginx:
    container_name: nginx
    build: ./requirements/nginx
    ports:
      - "443:443" # machine : container
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
    healthcheck:
      test: ["CMD", "pidof", "nginx"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      wordpress:
        condition: service_healthy
    restart: on-failure
    volumes:
       - wordpress_data:/var/www/html
    networks:
      - inception

  wordpress:
    build: ./requirements/wordpress
    container_name: wordpress
    environment:
      - WP_TITLE=${WP_TITLE}
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    secrets:
      - db_password
      - wp_admin
      - wp_admin_password
      - wp_admin_mail
      - wp_user
      - wp_user_password
      - wp_user_mail
      - mysql_user
      - mysql_admin_mail
      - mysql_user_mail
    depends_on:
      mariadb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm83"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: on-failure
    volumes:
      - type: volume
        source: wordpress_data
        target: /var/www/html/
    networks:
      - inception

volumes:
  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/wordpress
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${HOME}/data/mysql

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt  
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin:
    file: ../secrets/wp_admin.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_admin_mail:
    file: ../secrets/wp_admin_mail.txt
  wp_user:
    file: ../secrets/wp_user.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  wp_user_mail:
    file: ../secrets/wp_user_mail.txt
  mysql_user:
    file: ../secrets/mysql_user.txt
  mysql_admin:
    file: ../secrets/mysql_admin.txt
  mysql_admin_mail:
    file: ../secrets/mysql_admin_mail.txt
  mysql_user_mail:
    file: ../secrets/mysql_user_mail.txt

   